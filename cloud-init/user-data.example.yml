#cloud-config
# ****************************************************************************
# USER EDIT THIS - per-VM config consumed by Proxmox / KVM after first boot.
#   - CHANGE_ME_USERNAME ... login user
#   - CHANGE_ME_PUBKEY    ... your SSH public key (key-only login)
#   - REPO_URL            ... this repository (change in ONE place)
#   - write_files/.env    ... secrets, short-lived tokens (see ansible/secrets.env.example)
# ****************************************************************************
#
# First boot: creates the user, injects .env, clones the repo, runs
# bootstrap.sh then make provision — ends in an agent-ready state.

# --- Repository (single place to change when the repo is renamed) ----------
write_files:
  - path: /opt/ai-agentos-bootstrap-url
    content: |
      https://github.com/<owner>/<repo>.git
    permissions: "0644"

# --- Secrets injected into the VM (short-lived tokens only) ----------------
  - path: /home/CHANGE_ME_USERNAME/.env
    owner: "CHANGE_ME_USERNAME:CHANGE_ME_USERNAME"
    permissions: "0600"
    content: |
      # fill from ansible/secrets.env.example (short-lived tokens only)
      # ANTHROPIC_API_KEY=
      # OPENAI_API_KEY=

users:
  - name: CHANGE_ME_USERNAME
    groups: [wheel]
    shell: /bin/bash
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    ssh_authorized_keys:
      - CHANGE_ME_PUBKEY

chpasswd:
  users:
    - name: CHANGE_ME_USERNAME
      password: CHANGE_ME_PASSWORD
      type: text

ssh_pwauth: true

package_update: true
packages:
  - git

# --- Automatic first-boot provisioning -------------------------------------
runcmd:
  - git clone --depth 1 "$(cat /opt/ai-agentos-bootstrap-url)" /opt/ai-agentos-bootstrap
  - chown -R CHANGE_ME_USERNAME:CHANGE_ME_USERNAME /opt/ai-agentos-bootstrap
  - su - CHANGE_ME_USERNAME -c 'cd /opt/ai-agentos-bootstrap && make bootstrap && make provision'