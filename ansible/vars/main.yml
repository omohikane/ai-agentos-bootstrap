---
# vars/main.yml - playbook-level variables
# ****************************************************************************
# * USER EDIT THIS - hostname / timezone / git identity / default model.     *
# * Apply with: make provision. Docs: docs/user-edits.md                     *
# ****************************************************************************

# Repository URL is centralized here (and in cloud-init/user-data.example.yml)
# so that renaming/cloning to a new repo is a one-line change.
repo_url: ""

# OS basics
hostname: ai-agent-vm
timezone: UTC
locale: en_US.UTF-8
lang: en_US.UTF-8

# Per-user settings
# git identity written to /etc/gitconfig (system-wide). Override per deploy.
# Set these to YOUR GitHub account name/email so commits are attributed to
# you — commits in agent repos use this identity.
git_user_name: "AI Agent"
git_user_email: "ai-agent@localhost"

# Real login user (the user that becomes root via passwordless sudo).
# Override with: ansible-playbook ... --extra-vars agent_user=myuser
agent_user: "{{ ansible_env.SUDO_USER | default('ai') }}"
agent_home: "{{ '/root' if agent_user == 'root' else '/home/' ~ agent_user }}"

# Per-agent config templates live under this directory (relative to playbook)
ai_config_dir: "{{ playbook_dir }}/config"

# Default agent used by the ai-agent systemd service (Phase 2)
ai_agent_default: opencode

# opencode model; empty = rely on provider/env (see ~/.env)
opencode_model: ""

# Project checkout location on the VM
project_dir: /opt/ai-agentos-bootstrap