---
# tools - general packages from vars/tools.list
# 'aur:' prefix routes a package to yay; everything else uses pacman.
- name: read tools.list
  ansible.builtin.set_fact:
    tools_all: >-
      {{ lookup('file', playbook_dir ~ '/vars/tools.list').splitlines()
         | select('match', '^\s*[^#]')
         | map('trim')
         | list }}

- name: split pacman vs aur packages
  ansible.builtin.set_fact:
    tools_pacman: "{{ tools_all | reject('match', '^aur:') | list }}"
    tools_aur: "{{ tools_all | select('match', '^aur:') | map('regex_replace', '^aur:', '') | list }}"

- name: install pacman tools
  ansible.builtin.pacman:
    name: "{{ tools_pacman }}"
    state: present
  when: tools_pacman | length > 0

- name: install aur tools via yay
  ansible.builtin.command: yay -S --needed --noconfirm {{ item | quote }}
  loop: "{{ tools_aur }}"
  register: aur_install
  changed_when: "'there is nothing to do' not in aur_install.stdout"
  when: tools_aur | length > 0

- name: enable docker service
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
  when: "'docker' in tools_pacman"