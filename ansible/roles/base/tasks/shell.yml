---
# shell - light dotfiles managed under a block we own (existing content kept).
- name: manage ~/.bashrc additions
  ansible.builtin.blockinfile:
    path: "{{ agent_home }}/.bashrc"
    create: true
    owner: "{{ agent_user }}"
    group: "{{ agent_user }}"
    mode: "0644"
    marker: "# >>> ai-agentos managed block >>>"
    block: |
      # colored output + sensible history
      alias ls='ls --color=auto'
      alias grep='grep --color=auto'
      alias ll='ls -lah'
      HISTCONTROL=ignoredups
      HISTSIZE=10000
      # node via fnm for interactive shells
      if command -v fnm >/dev/null 2>&1; then eval "$(fnm env --shell bash)"; fi
      PS1='\u@\h:\w\$ '

- name: block bash_profile to source bashrc
  ansible.builtin.blockinfile:
    path: "{{ agent_home }}/.bash_profile"
    create: true
    owner: "{{ agent_user }}"
    group: "{{ agent_user }}"
    mode: "0644"
    marker: "# ai-agent-osm bash_profile block"
    block: |
      if [ -f "$HOME/.bashrc" ]; then . "$HOME/.bashrc"; fi