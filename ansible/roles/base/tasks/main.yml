---
# base - OS basics and project checkout
# arch hostname module does not support Arch Linux; use /etc/hostname + hostnamectl.
- name: ensure /etc/hostname
  ansible.builtin.copy:
    dest: /etc/hostname
    content: "{{ hostname }}\n"

- name: set running hostname (systemd hosts only)
  ansible.builtin.command: hostnamectl set-hostname {{ hostname }}
  changed_when: false
  when: systemd_running

- name: set timezone (only where systemd runs timedatectl)
  ansible.builtin.command: timedatectl set-timezone {{ timezone }}
  changed_when: false
  when: systemd_running

- name: enable and start systemd-timesyncd
  ansible.builtin.systemd:
    name: systemd-timesyncd
    enabled: true
    state: started
  when: systemd_running

- name: ensure locale uncommented in /etc/locale.gen
  ansible.builtin.lineinfile:
    path: /etc/locale.gen
    regexp: "^#?{{ locale | regex_escape }}"
    line: "{{ locale }}"

- name: generate locales
  ansible.builtin.command: locale-gen
  changed_when: false

- name: set system locale
  ansible.builtin.copy:
    dest: /etc/locale.conf
    content: "LANG={{ lang }}\n"

- name: ensure project checkout (if repo_url is set)
  ansible.builtin.git:
    repo: "{{ repo_url }}"
    dest: "{{ project_dir }}"
    version: main
  when: repo_url | length > 0