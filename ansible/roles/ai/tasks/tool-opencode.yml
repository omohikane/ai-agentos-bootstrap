---
# tool-opencode - install opencode CLI and render its config.
# opencode is a Node CLI; npm is available through the fnm-managed LTS Node
# (installed by bootstrap.sh). Installed as the login user.
- name: install opencode via npm
  ansible.builtin.command: bash -lc 'eval "$(fnm env --shell bash)" && npm install -g opencode-ai'
  become: true
  become_user: "{{ agent_user }}"
  register: oc_install
  changed_when: oc_install.rc == 0

- name: ensure opencode config directory
  ansible.builtin.file:
    path: "{{ agent_home }}/.config/opencode"
    state: directory
    owner: "{{ agent_user }}"
    group: "{{ agent_user }}"
  become: true

- name: render opencode config
  ansible.builtin.template:
    src: "{{ ai_config_dir }}/opencode/opencode.json.j2"
    dest: "{{ agent_home }}/.config/opencode/opencode.json"
    owner: "{{ agent_user }}"
    group: "{{ agent_user }}"
  become: true