---
# ai - AI agent tools from vars/ai-tools.list
# Each enabled tool is installed and configured by a per-tool task file.
- name: read ai-tools.list
  ansible.builtin.set_fact:
    ai_tools: >-
      {{ lookup('file', playbook_dir ~ '/vars/ai-tools.list').splitlines()
         | select('match', '^\s*[^#]')
         | map('trim')
         | list }}

- name: show selected ai tools
  ansible.builtin.debug:
    var: ai_tools

# --- agent runtime plumbing (independent of which tools are selected) -------
- name: install run-agent entry point
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/run-agent.sh"
    dest: /usr/local/bin/run-agent
    mode: "0755"

- name: render ai-agent systemd unit
  ansible.builtin.template:
    src: ai-agent.service.j2
    dest: /etc/systemd/system/ai-agent.service
  when: systemd_running

- name: deploy autonomous coding guide into agent opencode config
  ansible.builtin.include_tasks: agent-guide.yml

# --- per-tool install + config ---------------------------------------------
- name: install and configure selected tools
  ansible.builtin.include_tasks: "tool-{{ item }}.yml"
  loop: "{{ ai_tools }}"

# Adding a new tool:
#   1. enable it in vars/ai-tools.list
#   2. provide a tasks file ansible/roles/ai/tasks/tool-<name>.yml
#   3. optionally add a config template under ansible/config/<name>/