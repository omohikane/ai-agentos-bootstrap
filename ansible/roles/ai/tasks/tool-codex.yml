---
# tool-codex - install the OpenAI codex CLI and render its config.
# codex is a Node CLI; installed via npm as the login user.
- name: check codex availability
  ansible.builtin.command: bash -lc 'eval "$(fnm env --shell bash)" && command -v codex'
  become: true
  become_user: "{{ agent_user }}"
  register: codex_check
  changed_when: false
  failed_when: false

- name: install codex via npm
  ansible.builtin.command: bash -lc 'eval "$(fnm env --shell bash)" && npm install -g @openai/codex'
  become: true
  become_user: "{{ agent_user }}"
  when: codex_check.rc != 0

- name: ensure codex config directory
  ansible.builtin.file:
    path: "{{ agent_home }}/.codex"
    state: directory
    owner: "{{ agent_user }}"
    group: "{{ agent_user }}"
  become: true

- name: render codex config
  ansible.builtin.template:
    src: "{{ ai_config_dir }}/codex/config.toml.j2"
    dest: "{{ agent_home }}/.codex/config.toml"
    owner: "{{ agent_user }}"
    group: "{{ agent_user }}"
  become: true