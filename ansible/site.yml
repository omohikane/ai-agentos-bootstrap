---
- name: self-apply bootstrap configuration
  hosts: localhost
  connection: local
  gather_facts: true
  become: true
  vars_files:
    - vars/main.yml

  pre_tasks:
    - name: detect whether systemd is PID 1 (false inside containers)
      ansible.builtin.stat:
        path: /run/systemd/system
      register: systemd_system_dir

    - name: set systemd_running fact
      ansible.builtin.set_fact:
        systemd_running: "{{ ansible_facts.service_mgr == 'systemd' and systemd_system_dir.stat.exists }}"

  roles:
    - role: base
    - role: tools
    - role: ai
    - role: security

  post_tasks:
    - name: list user-editable files
      ansible.builtin.debug:
        msg:
          - "Files a user edits (repo: {{ project_dir }}):"
          - "  ansible/vars/tools.list       # general packages (one per line)"
          - "  ansible/vars/ai-tools.list    # AI agents to enable"
          - "  ansible/vars/main.yml         # hostname, timezone, git identity, model"
          - "  cloud-init/user-data.example.yml  # username, SSH key, .env"
          - "  ansible/secrets.env.example   # -> ~/.env (short-lived tokens)"